<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Telegraph-Image Admin</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --line: #d8e0ec;
      --text: #20324a;
      --muted: #62758f;
      --pri: #1f6ed4;
      --ok: #0e9153;
      --warn: #9a6700;
      --err: #b42318;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 28px; }
    .search { width: 340px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; }
    .summary { color: var(--muted); margin: 8px 0 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    th, td { border-bottom: 1px solid #edf2f8; padding: 10px; vertical-align: top; font-size: 13px; }
    th { background: #f8fbff; text-align: left; color: #2a415f; }
    tr:hover td { background: #fbfdff; }
    .preview { width: 220px; max-width: 220px; }
    .preview img, .preview video, .preview audio { width: 100%; max-width: 220px; }
    .meta { white-space: pre-wrap; font-family: Consolas, Menlo, monospace; font-size: 12px; color: #405672; }
    .ops { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; color: #fff; font-size: 12px;
    }
    .b-copy { background: var(--pri); }
    .b-white { background: var(--ok); }
    .b-block { background: var(--warn); }
    .b-del { background: var(--err); }
    .link { color: var(--pri); text-decoration: none; }
    .tag { display: inline-block; padding: 3px 8px; border-radius: 999px; background: #eef4fd; color: #315a8f; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Dashboard</h1>
      <input id="search" class="search" placeholder="按文件名搜索">
    </div>
    <div id="summary" class="summary">加载中...</div>
    <table>
      <thead>
        <tr>
          <th>文件名</th>
          <th>上传时间</th>
          <th>大小(KB)</th>
          <th>类型</th>
          <th>预览</th>
          <th>状态</th>
          <th>数据</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    let tableData = [];
    const rowsEl = document.getElementById("rows");
    const summaryEl = document.getElementById("summary");
    const searchEl = document.getElementById("search");

    function extOf(name) {
      const i = name.lastIndexOf(".");
      return i > 0 ? name.slice(i + 1).toLowerCase() : "";
    }
    function isImage(ext) { return ["png","jpg","jpeg","gif","webp","svg","bmp","avif"].includes(ext); }
    function isVideo(ext) { return ["mp4","webm","mov","mkv","m4v"].includes(ext); }
    function isAudio(ext) { return ["mp3","wav","ogg","aac","flac","m4a"].includes(ext); }
    function escapeHtml(s) {
      return String(s || "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
    }

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      const data = tableData.filter(x => !q || (x.originalName || x.name || "").toLowerCase().includes(q));
      summaryEl.textContent = `记录总数：${data.length}`;

      rowsEl.innerHTML = data.map((row) => {
        const name = row.name;
        const display = row.originalName || row.name;
        const uploadTime = row.uploadTime || "";
        const sizeKB = row.sizeKB || "0.00";
        const ftype = (row.fileType || extOf(display) || "unknown").toLowerCase();
        const url = `/file/${encodeURIComponent(name)}`;
        const status = (row.metadata && row.metadata.ListType) || "None";
        let preview = `<a class="link" href="${url}" target="_blank">打开文件</a>`;
        if (isImage(ftype)) preview = `<img src="${url}" alt="${escapeHtml(display)}">`;
        if (isVideo(ftype)) preview = `<video controls src="${url}"></video>`;
        if (isAudio(ftype)) preview = `<audio controls src="${url}"></audio>`;

        return `
          <tr>
            <td>${escapeHtml(display)}</td>
            <td>${escapeHtml(uploadTime)}</td>
            <td>${escapeHtml(sizeKB)}</td>
            <td><span class="tag">${escapeHtml(ftype)}</span></td>
            <td class="preview">${preview}</td>
            <td>${escapeHtml(status)}</td>
            <td class="meta">${escapeHtml(JSON.stringify(row.metadata || {}, null, 2))}</td>
            <td>
              <div class="ops">
                <button class="b-copy" onclick="handleCopy('${encodeURIComponent(name)}')">复制链接</button>
                <button class="b-white" onclick="handleWhite('${encodeURIComponent(name)}')">白名单</button>
                <button class="b-block" onclick="handleBlock('${encodeURIComponent(name)}')">黑名单</button>
                <button class="b-del" onclick="handleDelete('${encodeURIComponent(name)}')">删除</button>
              </div>
            </td>
          </tr>`;
      }).join("");
    }

    async function api(path) {
      const res = await fetch(path, { method: "GET", credentials: "include" });
      if (!res.ok) throw new Error(`${path} -> ${res.status}`);
      const text = await res.text();
      try { return JSON.parse(text); } catch { return text; }
    }

    async function loadData() {
      const data = await api("./api/manage/list");
      tableData = Array.isArray(data) ? data : [];
      render();
    }

    window.handleCopy = async function (nameEncoded) {
      const text = `${location.origin}/file/${decodeURIComponent(nameEncoded)}`;
      await navigator.clipboard.writeText(text);
      alert("已复制链接");
    };
    window.handleWhite = async function (nameEncoded) {
      if (!confirm("确认加入白名单？")) return;
      await api(`./api/manage/white/${nameEncoded}`);
      await loadData();
    };
    window.handleBlock = async function (nameEncoded) {
      if (!confirm("确认加入黑名单？")) return;
      await api(`./api/manage/block/${nameEncoded}`);
      await loadData();
    };
    window.handleDelete = async function (nameEncoded) {
      if (!confirm("确认删除此文件？")) return;
      await api(`./api/manage/delete/${nameEncoded}`);
      await loadData();
    };

    searchEl.addEventListener("input", render);
    loadData().catch((e) => {
      console.error(e);
      summaryEl.textContent = "加载失败，请检查鉴权或网络。";
    });
  </script>
</body>
</html>
