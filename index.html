<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Telegraph-Image | Cloudflare File Upload</title>
  <style>
    :root {
      --bg-1: #0b1324;
      --bg-2: #132d52;
      --card: #ffffff;
      --text: #1d2b3d;
      --muted: #5e6f86;
      --primary: #f38020;
      --primary-dark: #d36812;
      --ok: #0d8a4f;
      --err: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1200px 500px at 85% -20%, rgba(243,128,32,.25), transparent 60%),
        radial-gradient(900px 450px at 0% 100%, rgba(59,167,255,.20), transparent 60%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
      padding: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
    }
    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-ghost { background: #eef3f9; color: #1f3550; }
    input[type=file] { display: none; }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      background: #f5f8fc;
      color: #30455f;
      min-height: 38px;
      display: flex;
      align-items: center;
    }
    .status.ok { background: #e8f8ef; color: var(--ok); }
    .status.err { background: #fdecec; color: var(--err); }
    .out {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }
    .out input {
      width: 100%;
      border: 1px solid #d5dce8;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      color: #22344c;
      background: #fff;
    }
    .footer {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
    }
    a { color: #235a95; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Telegraph-Image</h1>
    <p class="sub">Cloudflare Pages + Functions + R2 + D1。支持任意文件格式上传。</p>

    <div class="row">
      <label for="fileInput" class="btn btn-primary">选择文件</label>
      <input id="fileInput" type="file" accept="*/*">
      <button id="uploadBtn" class="btn btn-ghost" type="button">开始上传</button>
      <button id="copyBtn" class="btn btn-ghost" type="button">复制链接</button>
    </div>

    <div id="status" class="status">等待选择文件</div>

    <section class="out">
      <input id="urlOut" readonly placeholder="上传后会显示文件 URL">
      <input id="mdOut" readonly placeholder="上传后会显示 Markdown 链接">
    </section>

    <p class="footer">管理面板：<a href="/admin.html">/admin.html</a></p>
  </main>

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const copyBtn = document.getElementById("copyBtn");
    const statusEl = document.getElementById("status");
    const urlOut = document.getElementById("urlOut");
    const mdOut = document.getElementById("mdOut");

    let selectedFile = null;

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    async function doUpload(file) {
      if (!file) {
        setStatus("请先选择文件", "err");
        return;
      }
      setStatus("上传中，请稍候...");
      const fd = new FormData();
      fd.append("file", file);

      const res = await fetch("/upload", { method: "POST", body: fd });
      if (!res.ok) {
        throw new Error("Upload failed: HTTP " + res.status);
      }
      const json = await res.json();
      const src = json && json[0] && json[0].src;
      if (!src) throw new Error("Upload response format invalid");

      const url = new URL(src, location.origin).toString();
      urlOut.value = url;
      mdOut.value = `![](${url})`;
      setStatus("上传成功", "ok");
    }

    fileInput.addEventListener("change", () => {
      selectedFile = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
      if (selectedFile) {
        setStatus(`已选择：${selectedFile.name} (${selectedFile.size} bytes)`);
      } else {
        setStatus("等待选择文件");
      }
    });

    uploadBtn.addEventListener("click", async () => {
      try {
        await doUpload(selectedFile);
      } catch (e) {
        console.error(e);
        setStatus("上传失败，请重试", "err");
      }
    });

    copyBtn.addEventListener("click", async () => {
      const value = urlOut.value;
      if (!value) {
        setStatus("没有可复制的链接", "err");
        return;
      }
      try {
        await navigator.clipboard.writeText(value);
        setStatus("链接已复制", "ok");
      } catch {
        urlOut.select();
        document.execCommand("copy");
        setStatus("链接已复制", "ok");
      }
    });
  </script>
</body>
</html>
