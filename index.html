<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Telegraph-Image</title>
  <style>
    :root {
      --bg1: #0b1730;
      --bg2: #123760;
      --card: #ffffff;
      --text: #16243a;
      --muted: #5f738d;
      --pri: #f38020;
      --pri-d: #ce6412;
      --ok: #0e9153;
      --err: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1000px 500px at 85% -20%, rgba(243,128,32,.26), transparent 55%),
        radial-gradient(900px 420px at 0% 100%, rgba(59,167,255,.24), transparent 60%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      padding: 22px;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, .28);
      padding: 24px;
    }
    h1 { margin: 0; font-size: 46px; letter-spacing: .2px; }
    .sub { margin: 8px 0 18px; color: var(--muted); font-size: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: var(--pri); color: #fff; }
    .btn-primary:hover { background: var(--pri-d); }
    .btn-ghost { background: #edf3fa; color: #1f3652; }
    input[type=file] { display: none; }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      background: #f2f6fb;
      color: #304965;
      min-height: 42px;
      display: flex;
      align-items: center;
    }
    .status.ok { background: #e8f8ef; color: var(--ok); }
    .status.err { background: #fdecec; color: var(--err); }
    .progress-wrap {
      margin-top: 10px;
      width: 100%;
      height: 14px;
      background: #e6edf6;
      border-radius: 999px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #28a0ff, #f38020);
      transition: width .15s linear;
    }
    .out { margin-top: 12px; display: grid; gap: 8px; }
    .out input {
      width: 100%;
      border: 1px solid #d6deea;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }
    .footer { margin-top: 14px; color: var(--muted); font-size: 13px; }
    a { color: #2a5f9c; text-decoration: none; }
  </style>
</head>
<body>
<main class="card">
  <h1>Telegraph-Image</h1>
  <p class="sub">Cloudflare Pages + Functions + R2 + D1。支持任意文件格式上传。</p>

  <div class="row">
    <label for="fileInput" class="btn btn-primary">选择文件</label>
    <input id="fileInput" type="file" accept="*/*">
    <button id="uploadBtn" class="btn btn-ghost" type="button">开始上传</button>
    <button id="copyBtn" class="btn btn-ghost" type="button">复制链接</button>
  </div>

  <div id="status" class="status">等待选择文件</div>
  <div id="progressWrap" class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>

  <section class="out">
    <input id="urlOut" readonly placeholder="上传后会显示文件 URL">
    <input id="mdOut" readonly placeholder="上传后会显示 Markdown 链接">
  </section>
  <p class="footer">管理面板：<a href="/admin">/admin</a></p>
</main>

<script>
  const fileInput = document.getElementById("fileInput");
  const uploadBtn = document.getElementById("uploadBtn");
  const copyBtn = document.getElementById("copyBtn");
  const statusEl = document.getElementById("status");
  const progressWrap = document.getElementById("progressWrap");
  const progressBar = document.getElementById("progressBar");
  const urlOut = document.getElementById("urlOut");
  const mdOut = document.getElementById("mdOut");
  let selectedFile = null;

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (type ? " " + type : "");
  }
  function setProgress(percent) {
    progressWrap.style.display = "block";
    progressBar.style.width = Math.max(0, Math.min(100, percent)) + "%";
  }
  function resetProgress() {
    progressWrap.style.display = "none";
    progressBar.style.width = "0%";
  }

  function uploadWithProgress(file) {
    return new Promise((resolve, reject) => {
      const fd = new FormData();
      fd.append("file", file);
      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/upload");
      xhr.upload.onprogress = (ev) => {
        if (!ev.lengthComputable) return;
        const pct = (ev.loaded / ev.total) * 100;
        setProgress(pct);
        setStatus(`上传中 ${pct.toFixed(1)}%`);
      };
      xhr.onload = () => {
        if (xhr.status < 200 || xhr.status >= 300) {
          reject(new Error("Upload failed: HTTP " + xhr.status + " " + xhr.responseText));
          return;
        }
        try {
          resolve(JSON.parse(xhr.responseText));
        } catch {
          reject(new Error("Upload response format invalid"));
        }
      };
      xhr.onerror = () => reject(new Error("Network error"));
      xhr.send(fd);
    });
  }

  fileInput.addEventListener("change", () => {
    selectedFile = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
    if (selectedFile) {
      setStatus(`已选择：${selectedFile.name} (${selectedFile.size} bytes)`);
    } else {
      setStatus("等待选择文件");
    }
  });

  uploadBtn.addEventListener("click", async () => {
    if (!selectedFile) {
      setStatus("请先选择文件", "err");
      return;
    }
    try {
      resetProgress();
      const json = await uploadWithProgress(selectedFile);
      const src = json && json[0] && json[0].src;
      if (!src) throw new Error("Missing src");
      const url = new URL(src, location.origin).toString();
      urlOut.value = url;
      mdOut.value = `![](${url})`;
      setProgress(100);
      setStatus("上传成功", "ok");
      setTimeout(resetProgress, 700);
    } catch (e) {
      console.error(e);
      setStatus("上传失败，请重试", "err");
    }
  });

  copyBtn.addEventListener("click", async () => {
    if (!urlOut.value) {
      setStatus("没有可复制的链接", "err");
      return;
    }
    try {
      await navigator.clipboard.writeText(urlOut.value);
      setStatus("链接已复制", "ok");
    } catch {
      urlOut.select();
      document.execCommand("copy");
      setStatus("链接已复制", "ok");
    }
  });
</script>
</body>
</html>
